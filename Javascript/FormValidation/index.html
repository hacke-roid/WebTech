<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <section>
        <article id="textArticle">Hello</article>
        
      <form action="" id="sign_up">
        <div>
          <input type="text" placeholder="Enter the User Name" id="username" />
          <aside id="error1"></aside>
        </div>
        <div>
          <input
            type="password"
            placeholder="Enter the Password"
            id="password"
          />
          <aside id="error2"></aside>
        </div>
        <div>
            <button id="show_pwd">Show Password</button>
        </div>
        <div>
            <button type="submit" id="submit_btn">Submit</button>
        </div>
        <div>
            <button type="reset" id="cancel_btn">Cancel</button>
        </div>
      </form>
    </section>

    <script src="./app.js"></script>
  </body>
</html>
